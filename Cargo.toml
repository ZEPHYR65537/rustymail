[workspace]
members = ["crates/core", "crates/protocol", "crates/store", "crates/server"]
resolver = "3"

[workspace.package]
version = "0.7.0"
edition = "2024"
rust-version = "1.94"
repository = "https://github.com/ZEPHYR65537/rustymail"
publish = false

[workspace.dependencies]
rustymail-core = { path = "crates/core" }
rustymail-protocol = { path = "crates/protocol" }
rustymail-store = { path = "crates/store" }
clap = { version = "4.6", features = ["derive"] }
fs2 = "0.4.3"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "sync", "time", "signal"] }
toml = "0.9"
uuid = { version = "1", features = ["v4"] }
argon2 = { version = "0.5.3", features = ["std", "zeroize"] }
base64 = "0.22"
getrandom = "0.4"
zeroize = { version = "1", features = ["derive"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring", "tls12"] }
rustix = { version = "1", features = ["process"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
time = { version = "0.3.55", features = ["formatting"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
await_holding_lock = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
