name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Tests including crash injection and real TCP
        run: cargo test --workspace --all-features --locked
      - name: Build command-line programs
        run: cargo build --workspace --locked
      - name: Independent SMTP client and forced-exit recovery
        run: python scripts/smoke.py
      - name: Build disposable TLS certificate generator
        run: cargo build -p rustymail-server --example m2_certificates --locked
      - name: Independent verified TLS, AUTH and Unix administration checks
        run: python scripts/m2_smoke.py --peer-denial-probe
      - name: Preserve M2 protocol evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m2-protocol-${{ matrix.os }}
          path: reports/local/m2-smoke.json
          if-no-files-found: warn
          retention-days: 14
      - name: Independent SMTP roles and STARTTLS boundary checks
        run: python scripts/m3_smoke.py
      - name: Preserve M3.1 protocol evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m3-protocol-${{ matrix.os }}
          path: reports/local/m3-smoke.json
          if-no-files-found: warn
          retention-days: 14
      - name: Documentation links and design attachments
        run: python scripts/check_docs.py
      - name: Independent local delivery trace and accounting checks
        run: python scripts/m32_smoke.py
      - name: Preserve M3.2 delivery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m32-delivery-${{ matrix.os }}
          path: reports/local/m32-smoke.json
          if-no-files-found: warn
          retention-days: 14
      - name: Independent SMTP input contract and relay matrix
        run: python scripts/m33_smoke.py
      - name: Preserve M3.3 contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m33-contract-${{ matrix.os }}
          path: reports/local/m33-smoke.json
          if-no-files-found: warn
          retention-days: 14

      - name: Build disposable outbound queue probe
        run: cargo build -p rustymail-store --example m41_probe --features test-support --locked
      - name: Offline queue and process-kill recovery boundaries
        run: python scripts/m41_smoke.py
      - name: Preserve M4.1 queue evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m41-queue-${{ matrix.os }}
          path: reports/local/m41-smoke.json
          if-no-files-found: warn
          retention-days: 14

      - name: Build disposable single-attempt SMTP client
        run: cargo build -p rustymail-server --example m42_attempt --features test-support --locked
      - name: Independent TLS relay and mixed durable submission
        run: python scripts/m42_smoke.py
      - name: Preserve M4.2 relay evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m42-relay-${{ matrix.os }}
          path: reports/local/m42-smoke.json
          if-no-files-found: warn
          retention-days: 14

  linux-storage-labs:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust and static Linux target
        run: rustup toolchain install 1.94.0 --profile minimal --target x86_64-unknown-linux-musl
      - name: Install disposable VM tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 busybox-static linux-image-virtual musl-tools zstd kmod e2fsprogs
          mkdir -p "$RUNNER_TEMP/rustymail-kernels"
          for kernel in /boot/vmlinuz-*; do
            sudo install -m 0644 "$kernel" "$RUNNER_TEMP/rustymail-kernels/"
          done
      - name: Build native optimized server
        run: cargo build --workspace --release --locked
      - name: Measure native SMTP latency and daemon memory
        run: python scripts/benchmark.py
      - name: Build disposable TLS certificate generator
        run: cargo build -p rustymail-server --example m2_certificates --release --locked
      - name: SMTP saturation, mixed TLS traffic and recovery
        run: python scripts/smtp_pressure.py
      - name: Build optimized single-attempt SMTP probe
        run: cargo build -p rustymail-server --example m42_attempt --features test-support --release --locked
      - name: Measure TLS streaming without buffering a whole message
        run: python scripts/relay_stream.py
      - name: Compare owned and reusable DATA framing
        run: cargo run -p rustymail-protocol --example framing --release --locked > reports/local/framing.json
      - name: Build static guest programs
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: |
          cargo build --workspace --release --locked --target x86_64-unknown-linux-musl
          cargo build -p rustymail-store --example m1_probe --features test-support --release --locked --target x86_64-unknown-linux-musl
      - name: VM power cuts and real filesystem exhaustion
        run: python scripts/powercut.py --kernel-dir "$RUNNER_TEMP/rustymail-kernels"
      - name: Preserve raw laboratory evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m1-linux-evidence
          path: |
            reports/local/benchmark.json
            reports/local/framing.json
            reports/local/powercut.json
            reports/local/smtp-pressure.json
            reports/local/relay-stream.json
            reports/local/failed-*.log
          if-no-files-found: warn
          retention-days: 14
