name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests including crash injection and real TCP
        run: cargo test --workspace --locked
      - name: Build command-line programs
        run: cargo build --workspace --locked
      - name: Independent SMTP client and forced-exit recovery
        run: python scripts/smoke.py
      - name: Documentation links and design attachments
        run: python scripts/check_docs.py
