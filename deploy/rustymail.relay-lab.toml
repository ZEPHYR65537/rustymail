# Fixed-upstream TLS relay lab; use serve --mode lab-relay. Not production.
# Start your controlled, verified TLS peer on localhost:3465 before sending.
# See docs/18-m4-smtp-relay.md; the automatic smoke script needs no manual setup.
mode = "lab"
hostname = "mail.example.com"
local_domains = ["example.com"]
data_dir = "data/lab"
admin_socket = "data/lab/admin/admin.sock"

[listeners]
smtp = "127.0.0.1:2525"
submissions = "127.0.0.1:2465"
submission = "127.0.0.1:2587"

[tls]
certificate_file = "data/lab-certificates/server.pem"
private_key_file = "data/lab-certificates/server.key"
minimum_version = "1.2"
handshake_timeout_seconds = 15

[limits]
connections = 256
connections_per_ip = 8
tls_handshakes = 16
# Decoded client bytes; generated local trace fields have a separate 2 KiB bound.
message_bytes = 26214400
header_bytes = 262144
recipients_per_message = 100
ingest_concurrency = 16
stream_buffer_bytes = 16384
disk_reserve_bytes = 2147483648
disk_reserve_percent = 10
# 400 MiB fits 15 reservations of (message_bytes + 2048), capped by ingest_concurrency.
temporary_reserved_bytes = 419430400

[timeouts]
smtp_command_seconds = 300
data_idle_seconds = 180
data_total_seconds = 1800
submission_unauthenticated_seconds = 60
shutdown_grace_seconds = 60

[store]
writer_queue = 128
writer_cache_kib = 8192

[authentication]
argon2_memory_kib = 65536
argon2_iterations = 3
argon2_lanes = 4
concurrency = 2
waiting_requests = 16
queue_timeout_seconds = 2

[delivery]
# Explicitly enabled only by serve --mode lab-relay.
mode = "relay"
concurrency = 16
per_domain_concurrency = 2
batch_size = 128
retry_seconds = [1800, 3600, 7200, 14400]
retry_jitter_percent = 20
max_age_seconds = 432000
connect_timeout_seconds = 30
banner_timeout_seconds = 300
command_timeout_seconds = 300
data_command_timeout_seconds = 120
data_write_timeout_seconds = 180
final_reply_timeout_seconds = 600

[relay]
ca_file = "data/lab-certificates/ca.pem"
host = "localhost"
port = 3465
tls = "implicit"
username = "" # Set a username only when your controlled peer requires AUTH.
password_file = "data/lab-secrets/relay-password"
